name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: install
        run: pip install -r requirements.txt pyyaml
      - name: licence and locality scan
        run: python tools/check_licences.py
      - name: tests
        run: python -m pytest -q tests
      - name: compose file parses
        run: python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
